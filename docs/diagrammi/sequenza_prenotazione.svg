<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Diagramma UML di sequenza: prenotazione di un evento</title>
  <desc id="d">Il visitatore conferma il modulo; l'interfaccia invia una richiesta POST alle API; Flask valida i dati, apre una transazione, legge evento e posti occupati; se i posti bastano salva la prenotazione e risponde 201, altrimenti annulla la transazione e risponde 404 o 409.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#214b3e"/>
    </marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10" fill="none" stroke="#214b3e" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="#ffffff"/>

  <!-- Partecipanti -->
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="30" y="20" width="140" height="44" rx="5" fill="#214b3e"/>
    <text x="100" y="47" fill="#ffffff">Visitatore</text>
    <rect x="250" y="20" width="180" height="44" rx="5" fill="#214b3e"/>
    <text x="340" y="40" fill="#ffffff">Interfaccia web</text>
    <text x="340" y="57" fill="#e2c67d" font-size="12" font-weight="normal">app.js nel browser</text>
    <rect x="520" y="20" width="180" height="44" rx="5" fill="#214b3e"/>
    <text x="610" y="40" fill="#ffffff">API Flask</text>
    <text x="610" y="57" fill="#e2c67d" font-size="12" font-weight="normal">routes.py</text>
    <rect x="780" y="20" width="150" height="44" rx="5" fill="#214b3e"/>
    <text x="855" y="40" fill="#ffffff">Database</text>
    <text x="855" y="57" fill="#e2c67d" font-size="12" font-weight="normal">SQLite</text>
  </g>
  <g stroke="#9aa59d" stroke-width="1.5" stroke-dasharray="5 5">
    <line x1="100" y1="64" x2="100" y2="620"/>
    <line x1="340" y1="64" x2="340" y2="620"/>
    <line x1="610" y1="64" x2="610" y2="620"/>
    <line x1="855" y1="64" x2="855" y2="620"/>
  </g>

  <!-- Blocco alt -->
  <rect x="60" y="340" width="870" height="270" fill="none" stroke="#a9573c" stroke-width="1.5"/>
  <path d="M60 340 h54 v16 l-8 8 h-46 z" fill="#f5e7c4" stroke="#a9573c" stroke-width="1.5"/>
  <text x="68" y="357" font-size="12" font-weight="bold" fill="#5a3d1c">alt</text>
  <text x="124" y="357" font-size="12" font-weight="bold" fill="#5a3d1c">[evento futuro, nessun duplicato, posti sufficienti]</text>
  <line x1="60" y1="480" x2="930" y2="480" stroke="#a9573c" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="124" y="498" font-size="12" font-weight="bold" fill="#5a3d1c">[altrimenti]</text>

  <!-- Messaggi -->
  <g font-size="13" fill="#1e2925">
    <line x1="100" y1="100" x2="336" y2="100" stroke="#214b3e" stroke-width="1.8" marker-end="url(#head)"/>
    <text x="110" y="92">1. compila il modulo e conferma</text>

    <line x1="340" y1="140" x2="606" y2="140" stroke="#214b3e" stroke-width="1.8" marker-end="url(#head)"/>
    <text x="350" y="132">2. POST /api/events/{id}/bookings</text>

    <path d="M610 168 h40 v26 h-36" fill="none" stroke="#214b3e" stroke-width="1.8" marker-end="url(#head)"/>
    <text x="660" y="172">3. valida nome, email e posti</text>
    <text x="660" y="189" fill="#5d6861">(se errati risponde subito 400)</text>

    <line x1="610" y1="236" x2="851" y2="236" stroke="#214b3e" stroke-width="1.8" marker-end="url(#head)"/>
    <text x="620" y="228">4. BEGIN IMMEDIATE (transazione)</text>

    <line x1="610" y1="276" x2="851" y2="276" stroke="#214b3e" stroke-width="1.8" marker-end="url(#head)"/>
    <text x="620" y="268">5. legge evento e posti occupati</text>

    <line x1="855" y1="316" x2="614" y2="316" stroke="#214b3e" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <text x="632" y="308">6. dati dell'evento</text>

    <line x1="610" y1="392" x2="851" y2="392" stroke="#214b3e" stroke-width="1.8" marker-end="url(#head)"/>
    <text x="620" y="384">7. INSERT prenotazione + COMMIT</text>

    <line x1="610" y1="428" x2="344" y2="428" stroke="#214b3e" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <text x="362" y="420">8. 201 Created + JSON</text>

    <line x1="340" y1="462" x2="104" y2="462" stroke="#214b3e" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <text x="122" y="454">9. conferma e posti aggiornati</text>

    <line x1="610" y1="528" x2="851" y2="528" stroke="#214b3e" stroke-width="1.8" marker-end="url(#head)"/>
    <text x="620" y="520">10. ROLLBACK (nessuna modifica)</text>

    <line x1="610" y1="562" x2="344" y2="562" stroke="#214b3e" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <text x="362" y="554">11. 404 / 409 + messaggio di errore</text>

    <line x1="340" y1="596" x2="104" y2="596" stroke="#214b3e" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <text x="122" y="588">12. avviso con il motivo del rifiuto</text>
  </g>
</svg>
